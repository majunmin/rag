spring:
  application:
    name: rag
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag}
    username: ${DB_USERNAME:rag}
    password: ${DB_PASSWORD:rag}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: rag-ingestion
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.majm.rag.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: false
    openai:
      base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${DASHSCOPE_API_KEY:${OPENAI_API_KEY:dummy}}
      chat:
        options:
          model: ${BAILIAN_CHAT_MODEL:qwen-plus}
      embedding:
        options:
          model: ${BAILIAN_EMBEDDING_MODEL:text-embedding-v3}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.2

app:
  storage:
    base-path: ${user.home}/rag-uploads
  ingestion:
    topic: document.ingestion
    dlt-topic: document.ingestion.dlt
  security:
    api-key-auth:
      enabled: ${API_KEY_AUTH_ENABLED:false}
      expected-key: ${API_KEY:}
  chat:
    # Sliding-window cap on conversation history. The N most recent messages
    # are kept in JSONB and replayed to the LLM on each turn. Avoids O(n^2)
    # token cost and unbounded JSONB growth on long conversations.
    max-history-messages: ${CHAT_MAX_HISTORY_MESSAGES:20}

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      # show-details=when-authorized hides db/disk/etc. details from anonymous
      # callers; the simple {status:UP|DOWN} body is enough for the admin UI
      # health indicator and external load balancers.
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  packages-to-scan: com.majm.rag
