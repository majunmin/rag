# Common configuration shared across all profiles. Overrides live in
# application-dev.yml and application-prod.yml. Activate via
#   SPRING_PROFILES_ACTIVE=dev    (default for local development)
# or
#   SPRING_PROFILES_ACTIVE=prod   (Dockerfile sets this)

spring:
  application:
    name: rag
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag}
    username: ${DB_USERNAME:rag}
    password: ${DB_PASSWORD:rag}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:rag-ingestion}
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # document.ingestion carries one schema. Ignore Java type headers so
        # messages written before a package move remain readable.
        spring.json.value.default.type: com.majm.rag.ingestion.domain.IngestionMessage
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "com.majm.rag.ingestion.domain"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Do not couple the durable message contract to a Java package name.
        spring.json.add.type.headers: false
    listener:
      # Match KafkaConfig#ingestionTopic partitions (3) so all of them are
      # consumed when running a single instance. Multiple instances should
      # each get a fair share via Kafka's group coordinator.
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: false
    openai:
      base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${DASHSCOPE_API_KEY:${OPENAI_API_KEY:dummy}}
      chat:
        base-url: ${BAILIAN_CHAT_BASE_URL:${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}}
        api-key: ${BAILIAN_CHAT_API_KEY:${DASHSCOPE_API_KEY:${OPENAI_API_KEY:dummy}}}
        options:
          model: ${BAILIAN_CHAT_MODEL:qwen-plus}
      embedding:
        # Chat-only gateways such as /openai/qwen do not expose embeddings.
        # Keep embedding on a dedicated provider unless explicitly overridden.
        base-url: ${BAILIAN_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
        api-key: ${BAILIAN_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:${OPENAI_API_KEY:dummy}}}
        options:
          model: ${BAILIAN_EMBEDDING_MODEL:text-embedding-v3}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}

app:
  storage:
    base-path: ${APP_STORAGE_BASE_PATH:${user.home}/rag-uploads}
  ingestion:
    topic: ${APP_INGESTION_TOPIC:document.ingestion}
    dlt-topic: ${APP_INGESTION_DLT_TOPIC:document.ingestion.dlt}
    outbox:
      delay-ms: ${APP_INGESTION_OUTBOX_DELAY_MS:1000}
      batch-size: ${APP_INGESTION_OUTBOX_BATCH_SIZE:20}
      send-timeout-ms: ${APP_INGESTION_OUTBOX_SEND_TIMEOUT_MS:10000}
  security:
    api-key-auth:
      enabled: ${API_KEY_AUTH_ENABLED:false}
      expected-key: ${API_KEY:}
  chat:
    # Sliding-window cap on conversation history. The N most recent messages
    # are kept in JSONB and replayed to the LLM on each turn. Avoids O(n^2)
    # token cost and unbounded JSONB growth on long conversations.
    max-history-messages: ${CHAT_MAX_HISTORY_MESSAGES:20}
  embedding:
    # DashScope hard limit is 10. OpenAI text-embedding-3 allows ~2048.
    batch-size: ${APP_EMBEDDING_BATCH_SIZE:10}
  rerank:
    # Two-stage retrieval: vector recall picks top-k-recall candidates, then
    # this cross-encoder rerank model rescores (query, chunk) pairs and we
    # keep the top-k requested by the caller. Set enabled=false to skip
    # rerank entirely (recall-only fallback).
    enabled: ${APP_RERANK_ENABLED:true}
    model: ${APP_RERANK_MODEL:gte-rerank-v2}
    # DashScope rerank lives at a different host than the OpenAI-compatible
    # /chat and /embeddings endpoints; default base-url points at the native
    # API root.
    base-url: ${APP_RERANK_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    api-key: ${APP_RERANK_API_KEY:${DASHSCOPE_API_KEY:${OPENAI_API_KEY:dummy}}}
    # How many candidates to fetch from the vector store before rerank.
    # Higher = better recall but slower + costlier rerank.
    top-k-recall: ${APP_RERANK_TOP_K_RECALL:20}
    timeout-ms: ${APP_RERANK_TIMEOUT_MS:3000}
    # Rerank returns (finalTopK * expand-factor) candidates so MMR has headroom
    # to drop duplicates. 2 is a safe default; bump to 3 if heavy overlap.
    expand-factor: ${APP_RERANK_EXPAND_FACTOR:2}
    # Drop candidates with rerank_score below this. Negative = disabled.
    # When all candidates are filtered out the service returns empty context,
    # letting the LLM prompt hit its "I don't know" branch instead of
    # hallucinating from unrelated chunks. Start with -1 (off); after seeing
    # real rerank score distributions, a typical cut-off is 0.2-0.3.
    score-threshold: ${APP_RERANK_SCORE_THRESHOLD:-1.0}
    # MMR de-duplication of near-identical chunks (overlap slices show up
    # multiple times otherwise). lambda in [0,1]: 1 = pure relevance, 0 =
    # pure diversity. 0.7 is a reasonable default.
    mmr-enabled: ${APP_RERANK_MMR_ENABLED:true}
    mmr-lambda: ${APP_RERANK_MMR_LAMBDA:0.7}
  query-rewrite:
    # Rewrites the user's question before retrieval. Three strategies compose
    # (left-to-right): "conversational" resolves coreference in multi-turn
    # follow-ups; "hyde" embeds an LLM-generated hypothetical answer; "multi-query"
    # fans out to N paraphrases and fuses with Reciprocal Rank Fusion.
    enabled: ${APP_QUERY_REWRITE_ENABLED:true}
    strategies: ${APP_QUERY_REWRITE_STRATEGIES:conversational,hyde}
    # Whole-chain wall clock budget. Floored to 500ms; on timeout we fall back
    # to the user's literal question (no LLM rewrite). RAG should degrade
    # quality, never crash, when the rewrite LLM is slow.
    timeout-ms: ${APP_QUERY_REWRITE_TIMEOUT_MS:3000}
    # Number of paraphrases requested when "multi-query" is active. Each
    # paraphrase costs one extra vector store recall; capped at 8.
    multi-query-count: ${APP_QUERY_REWRITE_MULTI_COUNT:3}
    # RRF k constant for fusing multi-query recall results. Larger k = flatter
    # weighting of top ranks; 60 is the standard from the RRF paper.
    rrf-k: ${APP_QUERY_REWRITE_RRF_K:60}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    accesslog:
      enabled: ${SERVER_ACCESSLOG_ENABLED:false}
      pattern: '%h %l %u %t "%r" %s %b %D'

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      # show-details=when-authorized hides db/disk/etc. details from anonymous
      # callers; the simple {status:UP|DOWN} body is enough for the admin UI
      # health indicator and external load balancers.
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
